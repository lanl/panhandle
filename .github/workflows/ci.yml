name: packaging

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cross-build:
    runs-on: ${{ matrix.config.runs_on }}
    timeout-minutes: 30
    # GITHUB_PATH additions don't reliably merge with the container's base
    # PATH for later docker execs in container jobs (a known GitHub Actions
    # limitation - it can end up as *only* the appended entries, losing
    # /usr/bin et al). Set PATH explicitly instead so every step's exec
    # sees both the cargo bin dirs and a full standard PATH.
    env:
      PATH: /root/.cargo/bin:/github/home/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    strategy:
      fail-fast: false
      matrix:
        config:
          - os_image: 'almalinux:8'
            shortname: 'el8'
            runs_on: 'ubuntu-latest'
            architecture: 'x86_64'
          - os_image: 'almalinux:8'
            shortname: 'el8'
            runs_on: 'ubuntu-24.04-arm'
            architecture: 'aarch64'
          - os_image: 'almalinux:9'
            shortname: 'el9'
            runs_on: 'ubuntu-latest'
            architecture: 'x86_64'
          - os_image: 'almalinux:9'
            shortname: 'el9'
            runs_on: 'ubuntu-24.04-arm'
            architecture: 'aarch64'
          - os_image: 'almalinux:10'
            shortname: 'el10'
            runs_on: 'ubuntu-latest'
            architecture: 'x86_64'
          - os_image: 'almalinux:10'
            shortname: 'el10'
            runs_on: 'ubuntu-24.04-arm'
            architecture: 'aarch64'
          - os_image: 'registry.suse.com/suse/sle15:15.5'
            shortname: 'sles'
            runs_on: 'ubuntu-latest'
            architecture: 'x86_64'
          - os_image: 'registry.suse.com/suse/sle15:15.5'
            shortname: 'sles'
            runs_on: 'ubuntu-24.04-arm'
            architecture: 'aarch64'
        package: ["panhandle"]

    container:
      image: ${{ matrix.config.os_image }}

    steps:
      - name: Install Base Tools (Container Environment)
        run: |
          if command -v dnf &> /dev/null; then
              dnf install -y --setopt=max_parallel_downloads=10 \
                  --setopt=retries=10 --setopt=timeout=60 \
                  openssl-devel pkgconf-pkg-config bash openssl \
                  clang clang-devel kernel-headers
          fi
          if command -v zypper &> /dev/null; then
              zypper install -y libopenssl-3-devel openssl pkg-config bash \
                  tar xz gzip curl linux-glibc-devel
          fi

      - name: Install libclang (SLES, from PyPI wheel)
        if: matrix.config.shortname == 'sles'
        run: |
          zypper install -y python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install libclang

          LIBCLANG=$(python3 -c "import clang, os; print(os.path.join(os.path.dirname(clang.__file__), 'native', 'libclang.so'))")
          ls -l "$LIBCLANG"
          ldd "$LIBCLANG" || true
          if ldd "$LIBCLANG" 2>&1 | grep -q 'not found'; then
              echo "libclang has unresolved dependencies" >&2
              exit 1
          fi
          echo "LIBCLANG_PATH=$(dirname "$LIBCLANG")" >> "$GITHUB_ENV"

      - name: Locate libclang (EL, for bindgen)
        if: matrix.config.shortname != 'sles'
        shell: bash
        run: |
          LIBCLANG=$(find /usr/lib64 /usr/lib -type f \
              \( -name 'libclang.so*' -o -name 'libclang-*.so*' \) \
              ! -name 'libclang-cpp*' 2>/dev/null | head -n1)
          if [ -z "$LIBCLANG" ]; then
              echo "libclang not found after installing clang" >&2
              exit 1
          fi
          echo "Found libclang: $LIBCLANG"
          echo "LIBCLANG_PATH=$(dirname "$LIBCLANG")" >> "$GITHUB_ENV"

      - name: Install aarch64 packages (Container Environment)
        if: matrix.config.architecture == 'aarch64'
        run: |
          # Native arm64 runner: native toolchain, no cross-compiler.
          # llvm-devel/llvm-toolset are needed to compile bpf-linker from source.
          if command -v dnf &> /dev/null; then
              dnf install -y --setopt=max_parallel_downloads=10 \
                  --setopt=retries=10 --setopt=timeout=60 \
                  gcc binutils libgcc glibc-devel llvm-devel llvm-toolset
          fi
          if command -v zypper &> /dev/null; then
              zypper install -y gcc gcc7
          fi

      - name: Install x86_64 packages (Container Environment)
        if: matrix.config.architecture == 'x86_64'
        run: |
          if command -v dnf &> /dev/null; then
              dnf install -y gcc binutils libgcc glibc-devel
          fi
          if command -v zypper &> /dev/null; then
              zypper install -y gcc gcc7
          fi
      
      - name: Point bindgen at GCC builtin headers (SLES)
        if: matrix.config.shortname == 'sles'
        run: |
          GCC_INC=$(gcc -print-file-name=include)
          ls "$GCC_INC/stddef.h"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$GCC_INC" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Get package version
        id: get_version
        shell: sh
        run: |
          VERSION=$(grep '^version' panhandle/panhandle/Cargo.toml | sed 's/version = //; s/"//g')
          RELEASE=$(grep '^release' panhandle/panhandle/Cargo.toml | sed 's/release = //; s/"//g')
          echo "PACKAGE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "PACKAGE_RELEASE=$RELEASE" >> $GITHUB_ENV
          echo "$PACKAGE_VERSION-$PACKAGE_RELEASE"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup toolchain install nightly --component rust-src
          rustup target add ${{ matrix.config.architecture }}-unknown-linux-gnu
          cargo install cargo-generate-rpm
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          success=0
          for i in 1 2 3; do
            if cargo binstall --no-confirm --maximum-resolution-timeout 30 bpf-linker; then
              success=1
              break
            fi
            echo "bpf-linker binstall attempt $i failed, retrying in 5s..."
            sleep 5
          done
          if [ "$success" -ne 1 ]; then
            echo "bpf-linker binstall failed after 3 attempts" >&2
            exit 1
          fi

      - name: Build Binary & Generate RPM
        shell: sh
        run: |
          . "$HOME/.cargo/env"
          cd ${{ matrix.package }}
          export CARGO_TARGET_DIR="./target/${{ matrix.config.architecture }}-unknown-linux-gnu"
          cargo build --target ${{ matrix.config.architecture }}-unknown-linux-gnu --bin ${{ matrix.package }} --release --all-features
          echo $CARGO_TARGET_DIR
          ls -al $CARGO_TARGET_DIR/${{ matrix.config.architecture }}-unknown-linux-gnu/release/panhandle
          strip -s $CARGO_TARGET_DIR/${{ matrix.config.architecture }}-unknown-linux-gnu/release/panhandle
          cargo generate-rpm --package ${{ matrix.package }} --target ${{ matrix.config.architecture }}-unknown-linux-gnu --output ../rpmbuild/${{ matrix.config.shortname }}/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}-${{ env.PACKAGE_VERSION }}-${{ env.PACKAGE_RELEASE }}.${{ matrix.config.shortname }}.${{ matrix.config.architecture }}.rpm
          path: rpmbuild/${{ matrix.config.shortname }}

  deb-build:
    runs-on: ${{ matrix.config.runs_on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config:
          # Ubuntu runs natively on these hosted runners (no container, no
          # cross-compilation needed for either arch), unlike the RPM matrix above.
          - shortname: 'ubuntu24.04'
            runs_on: 'ubuntu-24.04'
            architecture: 'x86_64'
          - shortname: 'ubuntu24.04'
            runs_on: 'ubuntu-24.04-arm'
            architecture: 'aarch64'
          # Public preview as of GA'd June 2026 - may see occasional instability.
          - shortname: 'ubuntu26.04'
            runs_on: 'ubuntu-26.04'
            architecture: 'x86_64'
          - shortname: 'ubuntu26.04'
            runs_on: 'ubuntu-26.04-arm'
            architecture: 'aarch64'
        package: ["panhandle"]

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev clang libclang-dev linux-libc-dev

      - uses: actions/checkout@v7

      - name: Get package version
        id: get_version
        run: |
          VERSION=$(grep '^version' panhandle/panhandle/Cargo.toml | sed 's/version = //; s/"//g')
          echo "PACKAGE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "$PACKAGE_VERSION"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup toolchain install nightly --component rust-src
          cargo install cargo-deb
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          success=0
          for i in 1 2 3; do
            if cargo binstall --no-confirm --maximum-resolution-timeout 30 bpf-linker; then
              success=1
              break
            fi
            echo "bpf-linker binstall attempt $i failed, retrying in 5s..."
            sleep 5
          done
          if [ "$success" -ne 1 ]; then
            echo "bpf-linker binstall failed after 3 attempts" >&2
            exit 1
          fi

      - name: Build .deb
        run: |
          . "$HOME/.cargo/env"
          cd ${{ matrix.package }}
          cargo deb --package ${{ matrix.package }} --all-features
          mkdir -p ../debbuild/${{ matrix.config.shortname }}
          cp target/debian/*.deb ../debbuild/${{ matrix.config.shortname }}/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}-${{ env.PACKAGE_VERSION }}.${{ matrix.config.shortname }}.${{ matrix.config.architecture }}.deb
          path: debbuild/${{ matrix.config.shortname }}