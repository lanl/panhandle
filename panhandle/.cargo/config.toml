# Configuration for panhandle project
# Allows all standard cargo commands to work properly

[target.'cfg(test)']

[target."cfg(all())"]
runner = "sudo -E"

# Build settings for eBPF programs
# Required for Aya v0.14+ - eBPF programs cannot use unwinding
[target.'cfg(target_arch = "bpf")']
rustflags = ["-C", "panic=abort"]

# Build settings
[build]
target = "x86_64-unknown-linux-gnu"

# Cargo aliases for convenience
[alias]
b = "build"
t = "test"
r = "run"
c = "check"
cl = "clippy"

# Term settings
[term]
verbose = false
