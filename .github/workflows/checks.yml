name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: docker.io/rust
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang libclang-dev linux-libc-dev pkg-config libssl-dev
      - name: Install toolchain
        run: |
          cd panhandle
          rustup toolchain install stable
          rustup toolchain install nightly --component rust-src
          rustup component add clippy
          rustup update
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          success=0
          for i in 1 2 3; do
            if cargo binstall --no-confirm --maximum-resolution-timeout 30 bpf-linker; then
              success=1
              break
            fi
            echo "bpf-linker binstall attempt $i failed, retrying in 5s..."
            sleep 5
          done
          if [ "$success" -ne 1 ]; then
            echo "bpf-linker binstall failed after 3 attempts" >&2
            exit 1
          fi
          cargo update
          cargo install cargo-sbom
      - name: Build & generate SBOM
        run: |
          cd panhandle
          cargo build --config ../.runner-config.toml --release
          cargo sbom > panhandle-sbom.spdx
      - uses: actions/upload-artifact@v7
        with:
          name: panhandle-sbom
          path: panhandle/panhandle-sbom.spdx

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: docker.io/rust
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang libclang-dev linux-libc-dev pkg-config libssl-dev
      - name: Install toolchain
        run: |
          cd panhandle
          rustup toolchain install stable
          rustup toolchain install nightly --component rust-src
          rustup component add clippy
          rustup update
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          success=0
          for i in 1 2 3; do
            if cargo binstall --no-confirm --maximum-resolution-timeout 30 bpf-linker; then
              success=1
              break
            fi
            echo "bpf-linker binstall attempt $i failed, retrying in 5s..."
            sleep 5
          done
          if [ "$success" -ne 1 ]; then
            echo "bpf-linker binstall failed after 3 attempts" >&2
            exit 1
          fi
          cargo update
      - name: Clippy
        run: |
          cd panhandle
          cargo clippy --all-targets --all-features -- -D warnings -A clippy::too_many_arguments

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: docker.io/rust
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang libclang-dev linux-libc-dev pkg-config libssl-dev
      - name: Install toolchain & build
        run: |
          cd panhandle
          rustup toolchain install stable
          rustup toolchain install nightly --component rust-src
          rustup component add clippy
          rustup update
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          success=0
          for i in 1 2 3; do
            if cargo binstall --no-confirm --maximum-resolution-timeout 30 bpf-linker; then
              success=1
              break
            fi
            echo "bpf-linker binstall attempt $i failed, retrying in 5s..."
            sleep 5
          done
          if [ "$success" -ne 1 ]; then
            echo "bpf-linker binstall failed after 3 attempts" >&2
            exit 1
          fi
          cargo update
          rm -rf .cargo
          cargo build --config ../.runner-config.toml --release
      - name: Test
        run: |
          cd panhandle
          cargo --config ../.runner-config.toml test

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: docker.io/rust
    steps:
      - uses: actions/checkout@v7
      - name: Audit
        run: |
          cd panhandle
          rustup update
          cargo update
          cargo install cargo-audit
          cargo audit --format terminal

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: docker.io/rust
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang libclang-dev linux-libc-dev pkg-config libssl-dev
      - name: Install toolchain & build
        run: |
          cd panhandle
          rustup toolchain install stable
          rustup toolchain install nightly --component rust-src
          rustup update
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          success=0
          for i in 1 2 3; do
            if cargo binstall --no-confirm --maximum-resolution-timeout 30 bpf-linker; then
              success=1
              break
            fi
            echo "bpf-linker binstall attempt $i failed, retrying in 5s..."
            sleep 5
          done
          if [ "$success" -ne 1 ]; then
            echo "bpf-linker binstall failed after 3 attempts" >&2
            exit 1
          fi
          cargo install cargo-deny
          cargo update
          cargo build --config ../.runner-config.toml
      - name: Deny
        run: |
          cd panhandle
          cargo deny check

  # Runs scripts/verify-functionality against a real kernel - the live CLI/config
  # regression suite that's not safe or possible to run on the hosted ubuntu-latest
  # runner above (it needs root and working eBPF: tracepoints/kprobes/uprobes/BTF
  # tracepoints, none of which hosted GitHub runners' containers support).
  #
  # Disabled by default: skipped entirely (not failed, not queued-forever) unless both
  #   1. a repository variable named EBPF_RUNNER_AVAILABLE is set to "true"
  #      (Settings -> Secrets and variables -> Actions -> Variables), and
  #   2. a self-hosted runner labeled "ebpf" is actually registered for this repo
  #      (Settings -> Actions -> Runners), on a real Linux host/VM (not a container)
  #      with CAP_SYS_ADMIN and a kernel new enough for BTF tracepoints.
  # Until both are true this job is simply absent from the checks list, not red.
  live-functional-verify:
    if: ${{ vars.EBPF_RUNNER_AVAILABLE == 'true' }}
    runs-on: [self-hosted, ebpf]
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          cd panhandle
          cargo build -p panhandle
      - name: Run scripts/verify-functionality
        # Not `sudo scripts/verify-functionality`: the script refuses to run as root
        # (it builds as the invoking user and only sudos the individual checks that
        # need to load eBPF programs) - the runner user needs passwordless sudo.
        run: scripts/verify-functionality
