[workspace]
resolver = "2"
members = ["panhandle", "panhandle-common", "panhandle-ebpf"]
default-members = ["panhandle", "panhandle-common"]

[workspace.dependencies]
aya = { git = "https://github.com/aya-rs/aya", tag = "aya-v0.16.0", default-features = false }
aya-build = { git = "https://github.com/aya-rs/aya", tag = "aya-v0.16.0", default-features = false }
aya-ebpf = { git = "https://github.com/aya-rs/aya", tag = "aya-v0.16.0", default-features = true }
aya-log = { git = "https://github.com/aya-rs/aya", tag = "aya-v0.16.0", default-features = false }
aya-log-ebpf = { git = "https://github.com/aya-rs/aya", tag = "aya-v0.16.0", default-features = false }

tokio = { version = "1.52.2", default-features = false }
which = { version = "8.0.2", features = [ "real-sys" ]}
